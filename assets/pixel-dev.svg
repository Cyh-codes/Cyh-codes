<svg xmlns="http://www.w3.org/2000/svg" width="520" height="76" viewBox="0 0 520 76" shape-rendering="crispEdges">
  <style>
    .hop { animation: hop 0.9s steps(2) infinite; }
    .steam { animation: steam 1.6s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .tail { animation: tail 1.4s steps(2) infinite; }
    .twinkle { animation: twinkle 1.8s steps(2) infinite; }
    @keyframes hop { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes steam { 0% { transform: translateY(2px); opacity: 0.25; } 50% { transform: translateY(-4px); opacity: 0.8; } 100% { transform: translateY(-8px); opacity: 0; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes tail { 0%, 100% { transform: translateX(0px); } 50% { transform: translateX(3px); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>

