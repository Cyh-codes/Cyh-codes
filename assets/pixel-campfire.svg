    @keyframes ember { 0% { transform: translateY(0px); opacity: 0.9; } 100% { transform: translateY(-18px); opacity: 0; } }
    @keyframes floaty { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
  </style>

